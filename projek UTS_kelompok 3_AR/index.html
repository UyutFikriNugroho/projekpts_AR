<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>AR ID Card Kelompok 3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Poppins;
    }

    body {
      height: 100vh;
      background:
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        radial-gradient(circle at top, #0f172a, #020617);
      background-size: 30px 30px, 30px 30px, 100% 100%;
      overflow: hidden;
      color: white;
    }

    /* GLOW */
    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      filter: blur(180px);
      opacity: 0.2;
      z-index: -2;
    }

    body::before {
      background: cyan;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: blue;
      bottom: -100px;
      right: -100px;
    }

    /* NAV */
    nav {
      position: fixed;
      width: 100%;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    nav h2 {
      color: cyan;
      font-size: 16px;
    }

    /* CONTAINER */
    .container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    /* CARD */
    .card {
      width: 360px;
      max-width: 95%;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      animation: fadeUp 1s ease;
    }

    /* SHINE */
    .card::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, transparent, rgba(0, 255, 255, 0.2), transparent);
      transform: rotate(25deg);
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%) rotate(25deg);
      }

      100% {
        transform: translateX(100%) rotate(25deg);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* TEXT */
    h1 {
      font-size: 26px;
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .role {
      font-size: 15px;
      opacity: 0.8;
    }

    .typing {
      color: cyan;
      margin: 12px 0 18px;
      font-size: 15px;
      min-height: 22px;
      font-family: monospace;
      letter-spacing: 1px;
    }

    .typing::after {
      content: '|';
      animation: blink 1s infinite;
      color: cyan;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* IMAGE */
    .image-box {
      padding: 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .image-box::after {
      content: '';
      position: absolute;
      top: -50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: cyan;
      box-shadow: 0 0 10px cyan, 0 0 20px cyan;
      animation: scan-img 3s linear infinite;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes scan-img {
      0% {
        top: -10%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 110%;
        opacity: 0;
      }
    }

    .preview {
      width: 250px;
      max-width: 100%;
      border-radius: 12px;
      transition: 0.3s;
    }

    .preview:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px cyan;
    }

    /* BUTTON */
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, cyan, blue);
      color: white;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      font-weight: 500;
      transition: 0.3s;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px cyan;
    }

    /* MENU BUTTON */
    .menu-btn {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-btn:hover {
      background: rgba(0, 255, 255, 0.2);
    }

    /* FOOTER */
    .social {
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.6;
    }

    /* SPACE ILLUSTRATION (FULL SCREEN) */
    .space-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: -3;
      pointer-events: none;
    }

    .space-planet {
      position: absolute;
      border-radius: 50%;
    }

    /* Earth-like */
    .earth {
      width: 35vw;
      height: 35vw;
      min-width: 200px;
      min-height: 200px;
      bottom: -10%;
      left: -10%;
      background: radial-gradient(circle at 30% 30%, #4ade80, #2563eb, #0f172a);
      box-shadow: inset -20px -20px 50px rgba(0, 0, 0, 0.8), 0 0 50px rgba(74, 222, 128, 0.2);
      animation: float-slow 10s ease-in-out infinite;
    }

    /* Saturn-like */
    .saturn {
      width: 28vw;
      height: 28vw;
      max-width: 250px;
      max-height: 250px;
      top: -5%;
      right: -5%;
      background: radial-gradient(circle at 30% 30%, #93c5fd, #3b82f6, #1e3a8a);
      box-shadow: inset -20px -20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(59, 130, 246, 0.3);
      animation: float-slow 12s ease-in-out infinite reverse;
    }

    .saturn::after {
      content: '';
      position: absolute;
      width: 160%;
      height: 25%;
      border: 20px solid rgba(147, 197, 253, 0.9);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(25deg);
      box-shadow: 0 0 30px rgba(147, 197, 253, 0.6), inset 0 0 30px rgba(147, 197, 253, 0.6);
    }

    /* Moon / Sun */
    .moon {
      width: 70px;
      height: 70px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 40% 40%, #ffffff, #cbd5e1, #64748b);
      box-shadow: 0 0 60px #ffffff, 0 0 120px rgba(255, 255, 255, 0.5);
      animation: pulse-moon 4s infinite alternate;
    }

    /* UFO & Rocket */
    .ufo {
      position: absolute;
      font-size: clamp(50px, 8vw, 80px);
      top: 35%;
      left: 10%;
      animation: ufo-fly 6s ease-in-out infinite;
      filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.8));
    }

    .rocket {
      position: absolute;
      font-size: clamp(60px, 10vw, 100px);
      bottom: 10%;
      right: 15%;
      transform: rotate(-45deg);
      animation: rocket-fly 3s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.8));
    }

    /* ASTRONAUT & FLAG */
    .astronaut-container {
      position: absolute;
      top: 20%;
      right: 10%;
      display: flex;
      align-items: flex-end;
      animation: float-astronaut 6s ease-in-out infinite;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
      z-index: 2;
    }

    .astronaut {
      font-size: clamp(40px, 6vw, 60px);
      z-index: 2;
    }

    .flag-container {
      display: flex;
      margin-left: -5px;
      margin-bottom: 5px;
      z-index: 1;
    }

    .pole {
      width: 4px;
      height: 70px;
      background: linear-gradient(to bottom, #cbd5e1, #64748b);
      border-radius: 2px;
    }

    .flag-img {
      width: 60px;
      height: 40px;
      object-fit: cover;
      background: white;
      border: 1px solid #ccc;
      border-radius: 0 5px 5px 0;
      transform-origin: left center;
      animation: wave-flag 2s ease-in-out infinite alternate;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    @keyframes float-slow {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(2deg);
      }
    }

    @keyframes pulse-moon {
      0% {
        box-shadow: 0 0 60px #ffffff;
      }

      100% {
        box-shadow: 0 0 80px #ffffff, 0 0 150px rgba(255, 255, 255, 0.6);
      }
    }

    @keyframes ufo-fly {

      0%,
      100% {
        transform: translate(0, 0) rotate(-10deg);
      }

      50% {
        transform: translate(40px, -30px) rotate(10deg);
      }
    }

    @keyframes rocket-fly {
      0% {
        transform: translate(0, 0) rotate(-45deg);
      }

      100% {
        transform: translate(-30px, -40px) rotate(-45deg);
      }
    }

    @keyframes float-astronaut {

      0%,
      100% {
        transform: translate(0, 0) rotate(5deg);
      }

      50% {
        transform: translate(-15px, 20px) rotate(-5deg);
      }
    }

    @keyframes wave-flag {
      0% {
        transform: skewY(5deg) scaleX(1);
      }

      100% {
        transform: skewY(-5deg) scaleX(0.95);
      }
    }

    /* CANVAS */
    canvas {
      position: absolute;
      z-index: -3;
    }
  </style>
</head>

<body>

  <canvas id="bg"></canvas>

  <!-- Space Scene (Full Screen) -->
  <div class="space-scene">
    <div class="space-planet earth"></div>
    <div class="space-planet saturn"></div>
    <div class="space-planet moon"></div>
    <div class="ufo">🛸</div>
    <div class="rocket">🚀</div>
    <div class="astronaut-container">
      <div class="astronaut">🧑‍🚀</div>
      <div class="flag-container">
        <div class="pole"></div>
        <img src="img/logounugha.png" class="flag-img" alt="Bendera UNUGHA">
      </div>
    </div>
  </div>

  <nav>
    <h2>AR CARD</h2>
    <div id="clock"></div>
  </nav>

  <div class="container">
    <div class="card">

      <h1>👩‍💻 Selamat Datang di Website kami👩‍💻 </h1>
      <div class="role">Mahasiswa Informatika</div>

      <div class="typing" id="typing"></div>

      <div class="image-box">
        <img src="assets/fotoklpk.png" class="preview">
      </div>

      <!-- BUTTON UTAMA -->
      <button onclick="bukaAR()">📷 Scan di sini</button>
      <button class="menu-btn" onclick="window.location.href='profil.html'">👩‍💻 Profil Tim</button>
      <button class="menu-btn" onclick="bukaGoogleMaps()">📍 UNUGHA CILACAP</button>
      <div class="social">Kelompok AR Project</div>

    </div>
  </div>

  <script>
    // JAM
    setInterval(() => {
      document.getElementById("clock").innerHTML =
        new Date().toLocaleTimeString();
    }, 1000);

    // TYPING
    let text = "AR ID Card Kelompok Informatika";
    let i = 0;
    function typing() {
      if (i < text.length) {
        document.getElementById("typing").innerHTML += text[i];
        i++;
        setTimeout(typing, 40);
      }
    }
    typing();

    // BUTTON
    function bukaAR() {
      window.location.href = "ar.html";
    }

    // STAR
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    let shootingStars = [];

    // Background Stars
    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5,
        alpha: Math.random()
      });
    }

    function createShootingStar() {
      return {
        x: Math.random() * canvas.width * 1.5,
        y: Math.random() * canvas.height * 0.5,
        len: Math.random() * 80 + 20,
        speed: Math.random() * 10 + 5,
        angle: Math.PI / 4, // 45 degrees
        life: 0,
        maxLife: Math.random() * 50 + 50
      };
    }

    for (let i = 0; i < 20; i++) {
      shootingStars.push(createShootingStar());
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Static Stars
      stars.forEach(s => {
        ctx.beginPath();
        ctx.globalAlpha = s.alpha;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
        s.alpha += (Math.random() - 0.5) * 0.1;
        if (s.alpha < 0.1) s.alpha = 0.1;
        if (s.alpha > 1) s.alpha = 1;
      });

      // Draw Shooting Stars
      shootingStars.forEach((s, index) => {
        s.life++;
        ctx.beginPath();
        ctx.globalAlpha = Math.max(0, 1 - (s.life / s.maxLife));
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - Math.cos(s.angle) * s.len, s.y - Math.sin(s.angle) * s.len);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.stroke();

        s.x -= Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;

        if (s.life > s.maxLife || s.y > canvas.height || s.x < 0) {
          shootingStars[index] = createShootingStar();
        }
      });

      requestAnimationFrame(draw);
    }
    draw();
    function bukaGoogleMaps() {
      // Lokasi UNUGHA Cilacap
      window.open('https://www.google.com/maps/search/?api=1&query=UNUGHA+Cilacap', '_blank');
    }
  </script>

</body>

</html>
